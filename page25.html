<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tha&#xEF; Malin &#x2014; Mini-guide Laos &#x2014; Page 25</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px 0;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .page {
    position: relative;
    width: 100%;
    max-width: 680px;
    aspect-ratio: 1024 / 1536;
    margin: 0 auto;
  }
  .page img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 6px;
  }
  .hotspot {
    position: absolute;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }
  .hotspot:active { transform: scale(0.97); }

  .btn-prev {
    border-radius: 50px;
    font-size: clamp(13px, 2.1vw, 16px);
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.5);
    backdrop-filter: blur(2px);
  }
  .btn-prev:hover { background: rgba(255,255,255,0.22); }

  .btn-next, .btn-restart {
    border-radius: 50px;
    font-size: clamp(13px, 2.1vw, 16px);
    background: linear-gradient(135deg, #d35400, #f0955a);
    color: #fff;
    box-shadow: 0 6px 18px rgba(211, 84, 0, 0.45);
  }
  .btn-next:hover, .btn-restart:hover { box-shadow: 0 8px 22px rgba(211, 84, 0, 0.6); }

  /* Barre de navigation sous l'image (hors illustration, jamais de superposition) */
  .navbar{display:flex;gap:12px;width:100%;max-width:680px;margin:14px auto 0;padding:0 14px;}
  .navbar .hotspot{position:static;width:auto;height:48px;flex:1;}
  .navbar .btn-prev{flex:0 0 auto;min-width:140px;}

  .btn-promo{left:1.5%;width:22%;top:51%;height:13%;background:rgba(255,255,255,0);}
  .btn-promo.vn{left:25.5%;}
  .btn-promo.reunion{left:49.5%;}
</style>
</head>
<body>

<div class="page">
  <img src="images/page25.webp" alt="Mini-guide Tha&#xEF; Malin Laos - Merci et a tres bientot">
  <a href="https://www.thaimalin.fr" target="_blank" rel="noopener" class="hotspot btn-promo" aria-label="Thailande"></a>
  <a href="https://pascalb2211-crypto.github.io/thai-malin-mini-guide-vietnam/" target="_blank" rel="noopener" class="hotspot btn-promo vn" aria-label="Vietnam"></a>
  <a href="https://pascalb2211-crypto.github.io/thai-malin-mini-guide-anime/" target="_blank" rel="noopener" class="hotspot btn-promo reunion" aria-label="Special Reunion"></a>
</div>
<div class="navbar">
  <a href="page24.html" class="hotspot btn-prev">&#x2190; Pr&#xE9;c&#xE9;dent</a>
  <a href="page1.html" class="hotspot btn-restart">Revenir au d&#xE9;but</a>
</div>

<script src="gate.js"></script>
</body>
</html>
